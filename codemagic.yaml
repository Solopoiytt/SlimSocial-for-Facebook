
workflows:
  facebook-mini-android:
    name: Facebook Mini Android APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: 3.44.8

    scripts:
      - name: Install dependencies
        script: |
          cd "$CM_BUILD_DIR/SlimSocial_for_Facebook"
          flutter pub get

      - name: Build Android APK
        script: |
          cd "$CM_BUILD_DIR/SlimSocial_for_Facebook"
          flutter build apk --debug

    artifacts:
      - SlimSocial_for_Facebook/build/app/outputs/flutter-apk/app-debug.apk
      
